{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4 hotel-card">
            <h3 class="section-title mb-3">Set New Password</h3>
            {% if validlink %}
            <form method="post" novalidate>
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-brand w-100">Change Password</button>
            </form>
            {% else %}
            <p class="text-danger">This reset link is invalid, possibly because it has already been used.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
